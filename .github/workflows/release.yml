name: Publicar APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Preparar arquivo de download
        run: cp app/build/outputs/apk/debug/app-debug.apk Folio-v${GITHUB_REF_NAME#v}-debug.apk

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Folio-v${GITHUB_REF_NAME#v}-debug.apk#Folio-v${GITHUB_REF_NAME#v}-debug.apk" \
            --title "Folio ${GITHUB_REF_NAME#v}" \
            --generate-notes
